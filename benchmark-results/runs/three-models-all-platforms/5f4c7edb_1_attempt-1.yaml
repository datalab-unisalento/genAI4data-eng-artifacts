id: bench_5f4c7edb_1
namespace: bench
tasks:
- id: t3_open_meteo_join
  type: io.kestra.plugin.scripts.python.Script
  runner: PROCESS
  script: |
    import urllib.request
    import json

    particulate_url = "http://recorder:8090/source/open-meteo/particulate?run_id=5f4c7edb_1&attempt=1"
    gases_url = "http://recorder:8090/source/open-meteo/gases?run_id=5f4c7edb_1&attempt=1"
    sink_url = "http://recorder:8090/sink/5f4c7edb_1?attempt=1"

    # Fetch particulate data
    req_p = urllib.request.Request(particulate_url)
    resp_p = urllib.request.urlopen(req_p)
    data_p = json.loads(resp_p.read().decode('utf-8'))

    # Fetch gases data
    req_g = urllib.request.Request(gases_url)
    resp_g = urllib.request.urlopen(req_g)
    data_g = json.loads(resp_g.read().decode('utf-8'))

    # Build time -> record mappings for inner join
    particulate_times = data_p['hourly']['time']
    gases_times = data_g['hourly']['time']

    # Create lookup dictionaries for O(n) join
    gas_lookup = {}
    for i, t in enumerate(gases_times):
        gas_lookup[t] = i

    records = []
    for i, t in enumerate(particulate_times):
        if t in gas_lookup:
            idx_g = gas_lookup[t]
            record = {
                "time": t,
                "pm10": data_p['hourly']['pm10'][i],
                "pm2_5": data_p['hourly']['pm2_5'][i],
                "nitrogen_dioxide": data_g['hourly']['nitrogen_dioxide'][idx_g],
                "ozone": data_g['hourly']['ozone'][idx_g]
            }
            records.append(record)

    # POST to sink
    payload = json.dumps(records).encode('utf-8')
    req_sink = urllib.request.Request(sink_url, data=payload, headers={'Content-Type': 'application/json'}, method='POST')
    urllib.request.urlopen(req_sink)
