id: bench_aec0fff5_1
namespace: bench
tasks:
  - id: ingest
    type: io.kestra.plugin.scripts.python.Script
    runner: PROCESS
    script: |
      import json
      import urllib.request

      source_url = "http://recorder:8090/source/usgs/earthquakes?run_id=aec0fff5_1&attempt=0"
      sink_url = "http://recorder:8090/sink/aec0fff5_1?attempt=0"

      # Fetch the source data
      with urllib.request.urlopen(source_url) as response:
          geojson_data = json.loads(response.read().decode('utf-8'))

      records = []
      for feature in geojson_data['features']:
          properties = feature['properties']
          geometry = feature['geometry']
          
          record = {
              "id": feature["id"],
              "magnitude": properties["mag"],
              "place": properties["place"],
              "time_ms": properties["time"],
              "longitude": geometry["coordinates"][0],
              "latitude": geometry["coordinates"][1],
              "depth_km": geometry["coordinates"][2]
          }

          # Derive magnitude_band
          mag = record["magnitude"]
          if mag < 4.0:
              record["magnitude_band"] = "minor"
          elif mag < 5.0:
              record["magnitude_band"] = "moderate"
          else:
              record["magnitude_band"] = "major"

          records.append(record)

      # POST to sink
      request = urllib.request.Request(
          sink_url,
          data=json.dumps(records).encode('utf-8'),
          headers={'Content-Type': 'application/json'},
          method='POST'
      )
      with urllib.request.urlopen(request) as response:
          pass  # Response is not used, but we ensure it's sent
