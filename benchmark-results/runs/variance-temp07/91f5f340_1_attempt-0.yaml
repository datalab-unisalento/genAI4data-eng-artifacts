id: bench_91f5f340_1
namespace: bench
tasks:
  - id: t5_trailing_three_hour_peak
    type: io.kestra.plugin.scripts.python.Script
    runner: PROCESS
    script: |
      import json
      import urllib.request

      source_url = "http://recorder:8090/source/open-meteo/particulate?run_id=91f5f340_1&attempt=0"
      sink_url = "http://recorder:8090/sink/91f5f340_1?attempt=0"

      # Fetch source data
      with urllib.request.urlopen(source_url) as response:
          data = json.loads(response.read().decode('utf-8'))

      hourly = data['hourly']
      times = hourly['time']
      pm2_5_values = hourly['pm2_5']

      results = []

      for i in range(2, len(times)):
          # Get the current and two previous pm2.5 values
          window = pm2_5_values[i-2:i+1]
          max_pm2_5 = max(window)
          
          record = {
              "time": times[i],
              "pm2_5": pm2_5_values[i],
              "pm2_5_peak_3h": max_pm2_5
          }
          results.append(record)

      # Post to sink
      request = urllib.request.Request(
          sink_url,
          data=json.dumps(results).encode('utf-8'),
          headers={'Content-Type': 'application/json'},
          method='POST'
      )
      with urllib.request.urlopen(request) as response:
          pass  # Just ensure the POST is made and successful
