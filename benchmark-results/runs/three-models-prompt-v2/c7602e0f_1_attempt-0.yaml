id: bench_c7602e0f_1
namespace: bench
tasks:
  - id: ingest
    type: io.kestra.plugin.scripts.python.Script
    runner: PROCESS
    script: |
      import json
      import urllib.request

      source_url = "http://recorder:8090/source/usgs/earthquakes?run_id=c7602e0f_1&attempt=0"
      sink_url = "http://recorder:8090/sink/c7602e0f_1?attempt=0"

      # Fetch the GeoJSON data
      with urllib.request.urlopen(source_url) as response:
          geojson_data = json.loads(response.read().decode('utf-8'))

      records = []

      for feature in geojson_data['features']:
          properties = feature['properties']
          geometry = feature['geometry']
          coordinates = geometry['coordinates']

          record = {
              "id": feature['id'],
              "magnitude": properties['mag'],
              "place": properties['place'],
              "time_ms": properties['time'],
              "longitude": coordinates[0],
              "latitude": coordinates[1],
              "depth_km": coordinates[2]
          }

          mag = record["magnitude"]
          if mag < 4.0:
              record["magnitude_band"] = "minor"
          elif mag < 5.0:
              record["magnitude_band"] = "moderate"
          else:
              record["magnitude_band"] = "major"

          records.append(record)

      # POST to sink
      req = urllib.request.Request(
          sink_url,
          data=json.dumps(records).encode('utf-8'),
          headers={'Content-Type': 'application/json'},
          method='POST'
      )
      with urllib.request.urlopen(req) as response:
          pass  # Response is not used, but we ensure the request completes
