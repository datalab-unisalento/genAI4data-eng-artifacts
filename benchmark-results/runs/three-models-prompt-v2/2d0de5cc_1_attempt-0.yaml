id: bench_2d0de5cc_1
namespace: bench

tasks:
  - id: t3_open_meteo_join
    type: io.kestra.plugin.scripts.python.Script
    runner: PROCESS
    script: |
      import json
      from urllib.request import urlopen, Request
      
      # Fetch particulate data
      with urlopen("http://recorder:8090/source/open-meteo/particulate?run_id=2d0de5cc_1&attempt=0") as response:
          particulate_data = json.load(response)
      
      # Fetch gases data
      with urlopen("http://recorder:8090/source/open-meteo/gases?run_id=2d0de5cc_1&attempt=0") as response:
          gases_data = json.load(response)
      
      # Convert hourly arrays to records for particulate
      particulate_records = [
          {
              "time": time,
              "pm10": pm10,
              "pm2_5": pm2_5
          }
          for time, pm10, pm2_5 in zip(
              particulate_data["hourly"]["time"],
              particulate_data["hourly"]["pm10"],
              particulate_data["hourly"]["pm2_5"]
          )
      ]
      
      # Convert hourly arrays to records for gases
      gases_records = [
          {
              "time": time,
              "nitrogen_dioxide": no2,
              "ozone": ozone
          }
          for time, no2, ozone in zip(
              gases_data["hourly"]["time"],
              gases_data["hourly"]["nitrogen_dioxide"],
              gases_data["hourly"]["ozone"]
          )
      ]
      
      # Create dictionaries for efficient lookup
      particulate_dict = {r["time"]: r for r in particulate_records}
      gases_dict = {r["time"]: r for r in gases_records}
      
      # Inner join on time
      joined_records = []
      for time, particulate_record in particulate_dict.items():
          if time in gases_dict:
              joined_record = {
                  "time": time,
                  "pm10": particulate_record["pm10"],
                  "pm2_5": particulate_record["pm2_5"],
                  "nitrogen_dioxide": gases_dict[time]["nitrogen_dioxide"],
                  "ozone": gases_dict[time]["ozone"]
              }
              joined_records.append(joined_record)
      
      # Post to sink
      request = Request(
          url="http://recorder:8090/sink/2d0de5cc_1?attempt=0",
          data=json.dumps({"records": joined_records}).encode('utf-8'),
          headers={'Content-Type': 'application/json'},
          method='POST'
      )
      
      with urlopen(request) as response:
          pass
