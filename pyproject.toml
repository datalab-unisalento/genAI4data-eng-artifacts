[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-generation-benchmark"
version = "0.1.0"
description = "Execution-based evaluation harness for LLM-generated data pipelines"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pipeline-bench = "pipeline_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
